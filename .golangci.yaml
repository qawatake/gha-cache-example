# referece: https://github.com/connectrpc/connect-go/blob/cd003a0d0733fc9a243c7e97732f863e11120abb/.golangci.yml
# migrated to the v2 schema with `golangci-lint migrate`
version: "2"
linters:
  default: all
  disable:
    - depguard # unnecessary for small libraries
    - exhaustruct # for simplicity of examples
    - funlen # rely on code review to limit function length
    - gomodguard # deprecated since v2.12.0; gomodguard_v2 is enabled via `default: all`
    - lll # don't want hard limits for line length
    - mnd # formerly gomnd
    - nlreturn # generous whitespace violates house style
    - varnamelen
    - wsl # generous whitespace violates house style
    - wsl_v5 # successor of wsl (wsl is deprecated since v2.2.0)
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt # prefer standard gofmt over gofumpt; rely on gci instead of goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
